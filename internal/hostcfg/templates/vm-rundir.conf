# written by orthogonals: the SPICE socket directory for {{.VMName}}.
# 0730 {{.User}}:qemu is the access control — qemu binds the socket (group
# write), the owner connects, nobody else traverses. QEMU creates the socket
# world-readable, so the directory is what keeps other users off the console.
d /run/orthogonals/{{.VMName}} 0730 {{.User}} qemu -
