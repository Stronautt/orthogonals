name: Regression

# The suites too slow or too stateful for the push gate in ci.yml.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        options: [all, fuzz, pins, vm, vfio]
        default: all

permissions:
  contents: read

# Never cancel: a dispatch queues behind a running nightly instead of killing
# a tier mid-run and stranding its guest.
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: false

env:
  # Both tiers run this after their apt install, never before: the install puts
  # the mode back, and a udev rule did not survive it either. The ioctl opens
  # the node as this user, which is the view testcloud's qemu:///session gets.
  KVM_READY: |
    test -e /dev/kvm || { echo "no /dev/kvm on this runner"; exit 1; }
    sudo chmod 666 /dev/kvm
    ls -l /dev/kvm
    python3 -c 'import fcntl, os; fcntl.ioctl(os.open("/dev/kvm", os.O_RDWR), 0xAE00)'

jobs:
  fuzz:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","fuzz"]'), inputs.suite))
    name: Fuzz ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [bls, domain, steps, hw, media, utils]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Fuzz every target in internal/${{ matrix.package }}
        run: |
          pkg=internal/${{ matrix.package }}
          echo "### Fuzz — $pkg" >> "$GITHUB_STEP_SUMMARY"
          for t in $(go test ./$pkg -list 'Fuzz.*' | grep '^Fuzz'); do
            echo "::group::$t"
            go test ./$pkg -run "$t" -fuzz "$t" -fuzztime=120s 2>&1 | tee fuzz.log
            status=${PIPESTATUS[0]}
            echo "::endgroup::"
            # Go's coordinator reports its own -fuzztime deadline as a test
            # failure when it wakes before cancellation reaches the worker
            # context (internal/fuzz, `stop(ctx.Err())`). A real finding writes
            # to testdata and can carry that same message, so the crasher tree
            # is the verdict, not the exit status.
            if [ "$status" -ne 0 ] &&
               grep -q '^    context deadline exceeded$' fuzz.log &&
               [ -z "$(ls -A $pkg/testdata/fuzz 2>/dev/null)" ]; then
              echo "- ⚠️ \`$t\` (120s, no crashers; upstream deadline flake)" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            [ "$status" -eq 0 ] || exit "$status"
            echo "- ✅ \`$t\` (120s, no crashers)" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload any crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers-${{ matrix.package }}
          path: internal/${{ matrix.package }}/testdata/fuzz/
          retention-days: 90

  pins:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","pins"]'), inputs.suite))
    name: Pinned downloads
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Check every pinned download
        run: |
          st=0
          go run ./test/pins > pins.txt 2>&1 || st=$?
          cat pins.txt
          { echo '### Pinned downloads'; echo '```'; cat pins.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $st

  vm-tier:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","vm"]'), inputs.suite))
    name: VM tier
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-go@v7
        with:
          # Not `stable`: this job merges the unit profile with one from a
          # binary the guest built using Fedora 44's golang. Two toolchains
          # disagree on block layout, and covdata keeps both rather than
          # summing counters, so the tier's blocks land in the denominator
          # only — worth 20 points, and `stable` moves on Go's schedule, not
          # Fedora's. `make coverage` refuses the merge if the two drift.
          go-version: '1.26'
      # libvirt-dev because the provision-virtual extra builds libvirt-python
      # from source — there is no binary wheel.
      - name: Install libvirt and tmt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvirt-daemon-system libvirt-dev python3-dev qemu-system-x86 genisoimage
          sudo systemctl start libvirtd
          pipx install 'tmt[provision-virtual]'
      # Stays after the install and immediately before the tier command.
      - name: Require a usable /dev/kvm
        run: ${{ env.KVM_READY }}
      - run: make test-vm
      - name: Test summary
        if: always()
        run: ./test/tmt/gha-summary.sh /var/tmp/orthogonals-tmt-vm >> "$GITHUB_STEP_SUMMARY"
      # Informational, never gated: the gating number is ci.yml's merged profile.
      - name: Merged coverage (unit + the real binary under tmt)
        run: |
          make coverage
          go tool cover -html=dist/coverage/merged.txt -o dist/coverage/coverage.html
          pct=$(make --no-print-directory coverage-pct)
          echo "### Coverage — unit + vm tier: ${pct}%" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-vm-tier
          path: |
            dist/coverage/merged.txt
            dist/coverage/coverage.html
          retention-days: 14

  vfio-tier:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","vfio"]'), inputs.suite))
    name: VFIO tier
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # Plain tmt: test/vfiohost boots the guest itself, because testcloud
      # cannot ask for the emulated IOMMU this job exists to have.
      - name: Install libvirt and tmt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvirt-daemon-system qemu-system-x86
          sudo systemctl start libvirtd
          sudo virsh net-start default || true
          # test/vfiohost dials the system socket (0770 root:libvirt); the sg
          # below picks the new group up without a re-login.
          sudo usermod -aG libvirt "$USER"
          pipx install tmt
      # Stays after the install and immediately before the tier command.
      - name: Require a usable /dev/kvm
        run: ${{ env.KVM_READY }}
      - run: sg libvirt -c "make test-vfio"
      - name: Test summary
        if: always()
        run: ./test/tmt/gha-summary.sh /var/tmp/orthogonals-tmt-vfio >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the guest's hook log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vfio-tier-logs
          path: /var/tmp/orthogonals-tmt-vfio/
          retention-days: 14

  report-failure:
    name: Report failure
    needs: [fuzz, pins, vm-tier, vfio-tier]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: File or update the regression issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create regression --repo "$GITHUB_REPOSITORY" \
            --description "Scheduled regression failures" --color B60205 --force
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --label regression --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Regression failure: $url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Scheduled regression failure" \
              --label regression --body "Automated tracker for scheduled regression failures. Latest: $url"
          fi
